server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NOTE: the base image's nginx.conf already does `include mime.types` at the
    # http level, so html/css/js/svg get correct types. We must NOT add a bare
    # `types {}` block here — it would replace the whole map and break everything.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Never cache the service worker or the HTML shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Give the PWA manifest its proper MIME type without touching the global map.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — serve index.html for any unknown route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
